# Push a tag like v5.0.1 to build both platforms, publish a GitHub release and upload the builds
# to the KCD1 and KCD2 Nexus Mods pages. Release notes come from the matching CHANGELOG.md section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      nexus_changelog: ${{ steps.notes.outputs.nexus_changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog.py "$version" --notes release-notes.md --plain nexus-changelog.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "nexus_changelog<<$delimiter"; cat nexus-changelog.txt; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: release-notes.md

  build:
    needs: changelog
    uses: ./.github/workflows/build.yml

  publish:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "KCD Mod Manager ${{ needs.changelog.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag

  nexus:
    name: Nexus Mods (${{ matrix.page }} ${{ matrix.variant }})
    needs: [changelog, publish]
    # Pre-release tags (v5.1.0-rc1) stay on GitHub only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # IDs are the numbers shown on the website (mod page URL, "File ID" in the Files tab);
        # scripts/nexus_release.py translates them to the v3 IDs the upload endpoints need.
        # The portable upload of each page also adds the changelog and bumps the page version.
        include:
          - page: KCD1
            game: kingdomcomedeliverance
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD1 }}
            variant: portable
            file: ${{ vars.NEXUSMODS_FILE_ID_KCD1_PORTABLE }}
            changelog: true
          - page: KCD1
            game: kingdomcomedeliverance
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD1 }}
            variant: installer
            file: ${{ vars.NEXUSMODS_FILE_ID_KCD1_INSTALLER }}
            changelog: false
          - page: KCD1
            game: kingdomcomedeliverance
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD1 }}
            variant: linux
            file: ${{ vars.NEXUSMODS_FILE_ID_KCD1_LINUX }}
            changelog: false
          - page: KCD2
            game: kingdomcomedeliverance2
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD2 }}
            variant: portable
            file: ${{ vars.NEXUSMODS_FILE_ID_KCD2_PORTABLE }}
            changelog: true
          - page: KCD2
            game: kingdomcomedeliverance2
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD2 }}
            variant: installer
            file: ${{ vars.NEXUSMODS_FILE_ID_KCD2_INSTALLER }}
            changelog: false
          - page: KCD2
            game: kingdomcomedeliverance2
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD2 }}
            variant: linux
            file: ${{ vars.NEXUSMODS_FILE_ID_KCD2_LINUX }}
            changelog: false
    env:
      VERSION: ${{ needs.changelog.outputs.version }}
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - name: Decide what to do
        id: mode
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ] || [ -z "${{ matrix.mod }}" ]; then
            echo "::warning::Skipping ${{ matrix.page }} ${{ matrix.variant }}: NEXUSMODS_API_KEY or NEXUSMODS_MOD_ID_${{ matrix.page }} is not set."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ matrix.file }}" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.variant }}" = "linux" ]; then
            echo "mode=create" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping ${{ matrix.page }} ${{ matrix.variant }}: its file ID variable is not set."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'

      - name: Resolve Nexus IDs
        id: ids
        if: steps.mode.outputs.mode != 'skip'
        run: python3 scripts/nexus_release.py resolve --game "${{ matrix.game }}" --mod "${{ matrix.mod }}" --file-version "${{ matrix.file }}"

      - uses: actions/download-artifact@v4
        if: steps.mode.outputs.mode != 'skip'
        with:
          name: ${{ matrix.variant == 'linux' && 'release-linux' || 'release-windows' }}
          path: release

      - name: Package
        id: package
        if: steps.mode.outputs.mode != 'skip'
        working-directory: release
        run: |
          base="KCDModManager-$VERSION"
          case "${{ matrix.variant }}" in
            portable)
              zip="$base-windows-x64-portable.zip"
              display="KCD Mod Manager $VERSION (Portable)"
              description="Portable Windows build. Unzip anywhere and run KCDModManager.exe." ;;
            installer)
              zip="$base-windows-x64-setup.zip"
              zip -j "$zip" "$base-windows-x64-setup.exe"
              display="KCD Mod Manager $VERSION (Installer)"
              description="Windows installer. Installs per user, no admin rights needed." ;;
            linux)
              zip="$base-linux-x86_64.zip"
              chmod +x "$base-x86_64.AppImage"
              zip -j "$zip" "$base-x86_64.AppImage" "$base-linux-x86_64.tar.gz"
              display="KCD Mod Manager $VERSION (Linux)"
              description="Linux build: AppImage (single file) and tarball (for systems without FUSE)." ;;
          esac
          test -f "$zip" || { echo "::error::$zip not found"; ls -l; exit 1; }
          {
            echo "path=release/$zip"
            echo "display=$display"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - name: Upload new version
        if: steps.mode.outputs.mode == 'update'
        # v1.0.0-beta.11, pinned to the commit because the action is still in beta.
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.ids.outputs.file_id }}
          filename: ${{ steps.package.outputs.path }}
          version: ${{ env.VERSION }}
          display_name: ${{ steps.package.outputs.display }}
          description: ${{ steps.package.outputs.description }}
          category: main
          archive_existing_version: "true"
          mod_id: ${{ steps.ids.outputs.mod_id }}
          changelog: ${{ matrix.changelog && needs.changelog.outputs.nexus_changelog || '' }}
          update_mod_version: ${{ matrix.changelog && 'true' || 'false' }}

      - name: Create file (first upload)
        id: create
        if: steps.mode.outputs.mode == 'create'
        run: |
          python3 scripts/nexus_release.py create-file \
            --mod-id "${{ steps.ids.outputs.mod_id }}" \
            --path "${{ steps.package.outputs.path }}" \
            --name "${{ steps.package.outputs.display }}" \
            --version "$VERSION" \
            --description "${{ steps.package.outputs.description }}"

      - name: Report new file ID
        if: steps.mode.outputs.mode == 'create'
        run: |
          id="${{ steps.create.outputs.file_version_website_id }}"
          echo "::notice::Created the ${{ matrix.variant }} file on the ${{ matrix.page }} page. Set NEXUSMODS_FILE_ID_${{ matrix.page }}_LINUX=$id so future releases add versions to it."
          {
            echo "### New Nexus file on the ${{ matrix.page }} page"
            echo ""
            echo "Set the repository variable \`NEXUSMODS_FILE_ID_${{ matrix.page }}_LINUX\` to \`$id\`:"
            echo ""
            echo "    gh variable set NEXUSMODS_FILE_ID_${{ matrix.page }}_LINUX --body $id --repo $GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
