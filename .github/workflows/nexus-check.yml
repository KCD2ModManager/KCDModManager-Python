# Manual dry run: checks the API key and translates every configured Nexus ID, uploads nothing.
name: Nexus check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ${{ matrix.page }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: KCD1
            game: kingdomcomedeliverance
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD1 }}
            files: "${{ vars.NEXUSMODS_FILE_ID_KCD1_PORTABLE }} ${{ vars.NEXUSMODS_FILE_ID_KCD1_INSTALLER }} ${{ vars.NEXUSMODS_FILE_ID_KCD1_LINUX }}"
          - page: KCD2
            game: kingdomcomedeliverance2
            mod: ${{ vars.NEXUSMODS_MOD_ID_KCD2 }}
            files: "${{ vars.NEXUSMODS_FILE_ID_KCD2_PORTABLE }} ${{ vars.NEXUSMODS_FILE_ID_KCD2_INSTALLER }} ${{ vars.NEXUSMODS_FILE_ID_KCD2_LINUX }}"
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: List files of the mod page
        run: python3 scripts/nexus_release.py files --game "${{ matrix.game }}" --mod "${{ matrix.mod }}"

      - name: Resolve IDs
        run: |
          python3 scripts/nexus_release.py resolve --game "${{ matrix.game }}" --mod "${{ matrix.mod }}"
          for file in ${{ matrix.files }}; do
            echo "file $file:"
            python3 scripts/nexus_release.py resolve --game "${{ matrix.game }}" --mod "${{ matrix.mod }}" --file-version "$file"
          done
