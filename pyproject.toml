[project]
name = "kcd-mod-manager"
version = "5.3.0"
description = "Cross-platform mod manager for Kingdom Come: Deliverance and Kingdom Come: Deliverance II"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "KCD Mod Manager contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6-Essentials>=6.8",
    "httpx>=0.27",
    "keyring>=25",
    "websockets>=13",
    "py7zr>=0.22",
    "rarfile>=4.2",
]

[project.scripts]
kcd-mod-manager = "kcd_mod_manager.__main__:main"

[project.gui-scripts]
kcd-mod-manager-gui = "kcd_mod_manager.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "respx>=0.21",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kcd_mod_manager"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]
ignore = [
    "N802",   # Qt overrides use camelCase (paintEvent, dropEvent, ...)
    "RUF001", # localized strings legitimately contain non-ASCII characters
    "RUF012",
    "N818",   # exception names describe the condition (NexusRateLimited, ScanCancelled)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH", "N", "E501"]
"src/kcd_mod_manager/ui/theme.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
markers = [
    "ui: tests that need a Qt application (run offscreen)",
]
